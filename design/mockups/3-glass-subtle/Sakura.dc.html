<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sakura theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A0615C}a:hover{color:#7C4844}
@keyframes sakuraFall{0%{transform:translate(0,-20px) rotate(0deg);opacity:0}12%{opacity:.7}100%{transform:translate(-90px,580px) rotate(420deg);opacity:0}}
.sakura-petal{position:absolute;top:0;width:8px;height:6px;border-radius:70% 0 70% 0;background:#EBC3BC;animation:sakuraFall 14s linear infinite}
.sakura-cap{transition:transform .14s ease,box-shadow .14s ease}
</style>
</helmet>
<div style="width: 960px; height: 540px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(55% 70% at 90% 6%, rgba(232,176,168,.22) 0%, rgba(232,176,168,0) 70%), radial-gradient(50% 60% at 4% 95%, rgba(214,196,180,.22) 0%, rgba(214,196,180,0) 70%), radial-gradient(40% 50% at 45% 55%, rgba(255,255,255,.7) 0%, rgba(255,255,255,0) 70%), #F2EEEA; font-family: Inter, system-ui, sans-serif; color: #2E2A29;">

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none;">
    <sc-for list="{{petals}}" as="p" hint-placeholder-count="6">
      <div class="sakura-petal" style="left: {{p.left}}; animation-delay: {{p.delay}}; animation-duration: {{p.dur}};"></div>
    </sc-for>
  </div>

  <div style="position: relative; box-sizing: border-box; height: 100%; padding: 28px 44px 0; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; gap: 14px; height: 84px;">
      <div style="flex-grow: 1; position: relative; overflow: hidden; border-radius: 18px; background: rgba(255,255,255,.5); backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%); border: 1px solid rgba(255,255,255,.75); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 10px 30px rgba(60,40,35,.07); display: flex; align-items: center; gap: 18px; padding: 0 24px 6px;">
        <svg aria-hidden="true" width="150" height="84" viewBox="0 0 150 84" style="position: absolute; right: 0; top: 0;">
          <g fill="#E8B8B0">
            <path d="M96 30 C 102 23, 112 25, 113 33 C 106 38, 99 36, 96 30 Z" opacity="0.8"></path>
            <path d="M118 46 C 124 40, 133 42, 133 49 C 127 53, 121 51, 118 46 Z" opacity="0.65"></path>
            <path d="M104 56 C 108 52, 114 53, 114 58 C 110 61, 106 60, 104 56 Z" opacity="0.5"></path>
            <path d="M126 20 C 130 16, 136 17, 136 22 C 132 25, 128 24, 126 20 Z" opacity="0.45"></path>
          </g>
        </svg>
        <div style="position: relative; font-weight: 400; font-size: 42px; line-height: 1; letter-spacing: -1px;">04:14</div>
        <div style="position: relative; font-size: 14px; color: #7A716E;">Friday, 27 November</div>
      </div>
      <button class="sakura-cap" onMouseEnter="{{vpn.focus}}" onClick="{{vpn.focus}}" aria-label="VPN: UK" style="outline: none; {{vpn.style}}">
        <span style="font-size: 12px; font-weight: 500; color: #7A716E; letter-spacing: 1px;">VPN</span>
        <span style="font-size: 18px; font-weight: 600; color: #2E2A29;">UK</span>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">
      <sc-for list="{{favs}}" as="k" hint-placeholder-count="8">
        <button class="sakura-cap" onMouseEnter="{{k.focus}}" onClick="{{k.focus}}" aria-label="{{k.name}}" style="outline: none; {{k.style}}">
          <span style="font-weight: 500; font-size: 17px; color: #2E2A29;">{{k.name}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{rest}}" as="k" hint-placeholder-count="12">
        <button class="sakura-cap" onMouseEnter="{{k.focus}}" onClick="{{k.focus}}" aria-label="{{k.name}}" style="outline: none; {{k.style}}">
          <span style="font-weight: 500; font-size: 13px; color: #2E2A29;">{{k.name}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#DDA79F","options":["#DDA79F","#C98F88","#B9C7B4","#C9B79C"]},"petals":{"editor":"boolean","default":true},"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { focused: 0 }; }
  renderVals() {
    const accent = this.props.accent ?? '#DDA79F';
    const showPetals = this.props.petals ?? true;
    const favs = [['YouTube'], ['Stremio'], ['TV', true], ['Hoichoi'], ['Netflix'], ['Prime Video'], ['BBC iPlayer'], ['ITVX']];
    const rest = [['Settings', true], ['Channel 4'], ['Kodi'], ['Plex'], ['Spotify'], ['Inputs', true], ['Downloader'], ['Pluto TV'], ['SmartTube'], ['MX Player'], ['LocalSend'], ['WireGuard']];
    // Glass keycaps: frosted white over the soft backdrop; the focused one grows and catches the light (Apple TV style).
    const cap = (h, r, pad, mod, focused) => {
      const face = mod ? 'rgba(248,236,233,.62)' : 'rgba(255,255,255,.66)';
      const base = 'position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; box-sizing: border-box; cursor: pointer; text-align: left; border-radius: ' + (r + 4) + 'px; height: ' + h + 'px; padding: ' + pad + '; border: 1px solid rgba(255,255,255,.8); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);';
      if (focused) {
        return base + ' background: linear-gradient(135deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.55) 42%, rgba(255,255,255,.8) 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -4px 0 rgba(0,0,0,.04), 0 0 0 1.5px ' + accent + '88, 0 24px 40px rgba(90,60,55,.2); transform: translateY(-4px) scale(1.06); z-index: 2;';
      }
      return base + ' background: ' + face + '; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -4px 0 rgba(0,0,0,.035), 0 6px 16px rgba(60,40,35,.06);';
    };
    const mk = (list, big, offset) => list.map(([name, mod], j) => {
      const i = j + offset;
      const f = this.state.focused === i;
      return {
        name,
        style: big ? cap(100, 14, '0 16px 20px', !!mod, f) : cap(70, 11, '0 12px 16px', !!mod, f),
        focus: () => this.setState({ focused: i })
      };
    });
    const vf = this.state.focused === -1;
    const vpn = {
      style: cap(84, 14, '0 16px 18px', true, vf) + ' width: 130px; flex-shrink: 0; gap: 2px;',
      focus: () => this.setState({ focused: -1 })
    };
    const petals = showPetals ? Array.from({ length: 6 }, (_, n) => ({
      left: (12 + (n * 41.3) % 86).toFixed(1) + '%',
      delay: ((n * 2.3) % 14).toFixed(2) + 's',
      dur: (13 + (n % 3) * 2).toFixed(1) + 's'
    })) : [];
    return { favs: mk(favs, true, 0), rest: mk(rest, false, 100), vpn, petals };
  }
}
</script>
</body>
</html>

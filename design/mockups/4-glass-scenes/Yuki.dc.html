<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yuki theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F6E9A}a:hover{color:#2A4F73}
@keyframes yukiFall{0%{transform:translate(0,-20px);opacity:0}8%{opacity:1}50%{transform:translate(20px,280px)}100%{transform:translate(-8px,580px);opacity:.6}}
.yuki-flake{position:absolute;top:0;border-radius:50%;background:#FFFFFF;box-shadow:0 0 3px rgba(70,95,130,.45);animation:yukiFall 12s linear infinite}
.yuki-cap{transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
</style>
</helmet>
<div style="width: 960px; height: 540px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #26303B;">

  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, #C9D7E6 0%, #DCE6F0 40%, #EEF3F8 70%, #F7F9FB 100%); pointer-events: none;">
    <svg width="960" height="540" viewBox="0 0 960 540" style="position: absolute; inset: 0;">
      <path d="M0 330 L 90 270 L 170 300 L 260 240 L 330 280 L 380 262 L 480 150 L 520 140 L 560 152 L 650 250 L 720 230 L 800 280 L 880 250 L 960 290 L 960 540 L 0 540 Z" fill="#B7C7D8"></path>
      <path d="M430 206 L 480 150 L 520 140 L 560 152 L 606 204 L 588 210 L 570 196 L 554 214 L 536 198 L 518 216 L 500 198 L 484 214 L 466 200 L 450 212 Z" fill="#FFFFFF"></path>
      <path d="M90 270 L 170 300 L 130 298 L 110 286 Z M 260 240 L 330 280 L 296 274 L 276 262 Z M 720 230 L 800 280 L 760 268 L 742 254 Z" fill="#F3F7FB"></path>
      <path d="M0 400 C 120 360, 260 380, 380 368 C 520 354, 640 386, 780 370 C 860 362, 920 372, 960 368 L 960 540 L 0 540 Z" fill="#E4ECF4"></path>
      <path d="M0 450 C 160 428, 330 446, 500 438 C 680 430, 820 452, 960 440 L 960 540 L 0 540 Z" fill="#F7FAFC"></path>
      <path d="M0 500 C 200 486, 420 500, 640 492 C 780 488, 880 498, 960 494 L 960 540 L 0 540 Z" fill="#FFFFFF"></path>

      <g transform="translate(18,356) scale(1.25)">
        <polygon points="35,0 55,40 15,40" fill="#4F6674"></polygon><polygon points="35,25 62,72 8,72" fill="#4F6674"></polygon><polygon points="35,55 70,110 0,110" fill="#4F6674"></polygon>
        <polygon points="35,0 44,18 26,18" fill="#FFFFFF"></polygon><polygon points="35,25 47,46 23,46" fill="#FFFFFF"></polygon><polygon points="35,55 50,80 20,80" fill="#FFFFFF"></polygon>
        <rect x="31" y="108" width="8" height="12" fill="#5C4A42"></rect>
      </g>
      <g transform="translate(110,392) scale(0.9)">
        <polygon points="35,0 55,40 15,40" fill="#5A7180"></polygon><polygon points="35,25 62,72 8,72" fill="#5A7180"></polygon><polygon points="35,55 70,110 0,110" fill="#5A7180"></polygon>
        <polygon points="35,0 44,18 26,18" fill="#FFFFFF"></polygon><polygon points="35,25 47,46 23,46" fill="#FFFFFF"></polygon><polygon points="35,55 50,80 20,80" fill="#FFFFFF"></polygon>
        <rect x="31" y="108" width="8" height="12" fill="#5C4A42"></rect>
      </g>
      <g transform="translate(172,418) scale(0.65)">
        <polygon points="35,0 55,40 15,40" fill="#6A8090"></polygon><polygon points="35,25 62,72 8,72" fill="#6A8090"></polygon><polygon points="35,55 70,110 0,110" fill="#6A8090"></polygon>
        <polygon points="35,0 44,18 26,18" fill="#FFFFFF"></polygon><polygon points="35,25 47,46 23,46" fill="#FFFFFF"></polygon><polygon points="35,55 50,80 20,80" fill="#FFFFFF"></polygon>
      </g>
      <g transform="translate(840,340) scale(1.4)">
        <polygon points="35,0 55,40 15,40" fill="#4F6674"></polygon><polygon points="35,25 62,72 8,72" fill="#4F6674"></polygon><polygon points="35,55 70,110 0,110" fill="#4F6674"></polygon>
        <polygon points="35,0 44,18 26,18" fill="#FFFFFF"></polygon><polygon points="35,25 47,46 23,46" fill="#FFFFFF"></polygon><polygon points="35,55 50,80 20,80" fill="#FFFFFF"></polygon>
        <rect x="31" y="108" width="8" height="12" fill="#5C4A42"></rect>
      </g>
      <g transform="translate(770,384) scale(1)">
        <polygon points="35,0 55,40 15,40" fill="#5A7180"></polygon><polygon points="35,25 62,72 8,72" fill="#5A7180"></polygon><polygon points="35,55 70,110 0,110" fill="#5A7180"></polygon>
        <polygon points="35,0 44,18 26,18" fill="#FFFFFF"></polygon><polygon points="35,25 47,46 23,46" fill="#FFFFFF"></polygon><polygon points="35,55 50,80 20,80" fill="#FFFFFF"></polygon>
        <rect x="31" y="108" width="8" height="12" fill="#5C4A42"></rect>
      </g>
      <g transform="translate(712,420) scale(0.62)">
        <polygon points="35,0 55,40 15,40" fill="#6A8090"></polygon><polygon points="35,25 62,72 8,72" fill="#6A8090"></polygon><polygon points="35,55 70,110 0,110" fill="#6A8090"></polygon>
        <polygon points="35,0 44,18 26,18" fill="#FFFFFF"></polygon><polygon points="35,25 47,46 23,46" fill="#FFFFFF"></polygon><polygon points="35,55 50,80 20,80" fill="#FFFFFF"></polygon>
      </g>
    </svg>
    <sc-for list="{{flakes}}" as="s" hint-placeholder-count="0">
      <div class="yuki-flake" style="left: {{s.left}}; width: {{s.size}}; height: {{s.size}}; opacity: {{s.op}}; animation-delay: {{s.delay}}; animation-duration: {{s.dur}};"></div>
    </sc-for>
  </div>

  <div style="position: relative; box-sizing: border-box; height: 100%; padding: 26px 44px 0; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; gap: 14px; height: 84px;">
      <div style="flex-grow: 1; border-radius: 18px; background: rgba(255,255,255,.42); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); border: 1px solid rgba(255,255,255,.7); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 10px 30px rgba(40,55,75,.08); display: flex; align-items: center; gap: 18px; padding: 0 24px;">
        <div style="font-weight: 300; font-size: 44px; line-height: 1; letter-spacing: -1px;">04:14</div>
        <div style="font-size: 14px; color: #55606C;">Friday, 27 November</div>
      </div>
      <button class="yuki-cap" onMouseEnter="{{vpn.focus}}" onClick="{{vpn.focus}}" aria-label="VPN: UK" style="outline: none; {{vpn.style}}">
        <span style="font-size: 12px; font-weight: 500; color: #55606C; letter-spacing: 1px;">VPN</span>
        <span style="font-size: 18px; font-weight: 600; color: #26303B;">UK</span>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">
      <sc-for list="{{favs}}" as="k" hint-placeholder-count="8">
        <button class="yuki-cap" onMouseEnter="{{k.focus}}" onClick="{{k.focus}}" aria-label="{{k.name}}" style="outline: none; {{k.style}}">
          <span style="font-weight: 500; font-size: 17px; color: #26303B;">{{k.name}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{rest}}" as="k" hint-placeholder-count="6">
        <button class="yuki-cap" onMouseEnter="{{k.focus}}" onClick="{{k.focus}}" aria-label="{{k.name}}" style="outline: none; {{k.style}}">
          <span style="font-weight: 500; font-size: 13px; color: #26303B;">{{k.name}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none;">
    <sc-for list="{{front}}" as="s" hint-placeholder-count="0">
      <div class="yuki-flake" style="left: {{s.left}}; width: {{s.size}}; height: {{s.size}}; opacity: {{s.op}}; animation-delay: {{s.delay}}; animation-duration: {{s.dur}};"></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8FB0D3","options":["#8FB0D3","#A9C4C7","#B4AFCF","#26303B"]},"snow":{"editor":"range","default":70,"min":0,"max":140,"step":5},"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { focused: 0 }; }
  renderVals() {
    const accent = this.props.accent ?? '#8FB0D3';
    const snow = this.props.snow ?? 70;
    const favs = [['YouTube'], ['Stremio'], ['TV', true], ['Hoichoi'], ['Netflix'], ['Prime Video'], ['BBC iPlayer'], ['ITVX']];
    const rest = [['Settings', true], ['Inputs', true], ['Channel 4'], ['Kodi'], ['Plex'], ['All apps', true]];
    const cap = (h, r, pad, mod, focused) => {
      const face = mod ? 'rgba(232,239,246,.55)' : 'rgba(255,255,255,.6)';
      const base = 'position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; box-sizing: border-box; cursor: pointer; text-align: left; border-radius: ' + r + 'px; height: ' + h + 'px; padding: ' + pad + '; border: 1px solid rgba(255,255,255,.8); backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%);';
      if (focused) {
        return base + ' background: linear-gradient(135deg, rgba(255,255,255,.97) 0%, rgba(255,255,255,.62) 44%, rgba(255,255,255,.85) 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -4px 0 rgba(0,0,0,.04), 0 0 0 1.5px ' + accent + ', 0 24px 40px rgba(40,55,75,.24); transform: translateY(-4px) scale(1.06); z-index: 2;';
      }
      return base + ' background: ' + face + '; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -4px 0 rgba(0,0,0,.035), 0 6px 16px rgba(40,55,75,.07);';
    };
    const mk = (list, big, offset) => list.map(([name, mod], j) => {
      const i = j + offset;
      const f = this.state.focused === i;
      return {
        name,
        style: big ? cap(96, 18, '0 16px 18px', !!mod, f) : cap(66, 15, '0 12px 14px', !!mod, f),
        focus: () => this.setState({ focused: i })
      };
    });
    const vf = this.state.focused === -1;
    const vpn = {
      style: cap(84, 18, '0 16px 16px', true, vf) + ' width: 130px; flex-shrink: 0; gap: 2px;',
      focus: () => this.setState({ focused: -1 })
    };
    const flake = (n, k) => ({
      left: ((n * 29.3 + k) % 100).toFixed(1) + '%',
      size: (3 + (n % 5)) + 'px',
      op: (0.6 + (n % 4) * 0.1).toFixed(2),
      delay: ((n * 0.47) % 12).toFixed(2) + 's',
      dur: (8 + (n % 6) * 1.2).toFixed(1) + 's'
    });
    const flakes = Array.from({ length: snow }, (_, n) => flake(n, 0));
    const front = Array.from({ length: Math.round(snow / 6) }, (_, n) => flake(n * 3 + 1, 13));
    return { favs: mk(favs, true, 0), rest: mk(rest, false, 100), vpn, flakes, front };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ume theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9E3B32}a:hover{color:#7A2C25}
@keyframes umeFall{0%{transform:translate(0,-10px) rotate(0deg);opacity:0}10%{opacity:.9}100%{transform:translate(-120px,560px) rotate(360deg);opacity:.1}}
.ume-petal{position:absolute;top:0;width:7px;height:7px;border-radius:50%;background:#C8392D;animation:umeFall 13s linear infinite}
.ume-cap{transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
</style>
</helmet>
<div style="width: 960px; height: 540px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #2B2927;">

  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, #F4F1EA 0%, #EEEAE1 60%, #E6E1D6 100%); pointer-events: none;">
    <svg width="960" height="540" viewBox="0 0 960 540" style="position: absolute; inset: 0;">
      <defs>
        <linearGradient id="umeMist" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#EEEAE1" stop-opacity="0"></stop>
          <stop offset="1" stop-color="#EEEAE1" stop-opacity="0.95"></stop>
        </linearGradient>
      </defs>
      <circle cx="170" cy="430" r="44" fill="#C8392D" opacity="0.85"></circle>
      <path d="M0 330 C 60 260, 110 250, 160 280 C 210 220, 260 170, 320 210 C 370 240, 400 230, 440 260 C 500 200, 560 180, 610 230 C 660 270, 700 250, 760 210 C 820 180, 880 220, 960 200 L 960 540 L 0 540 Z" fill="#A9A49B" opacity="0.45"></path>
      <path d="M0 330 L 960 330 L 960 400 L 0 400 Z" fill="url(#umeMist)"></path>
      <path d="M0 400 C 80 340, 150 350, 210 380 C 280 330, 350 310, 420 350 C 480 380, 540 360, 600 330 C 660 300, 740 330, 800 370 C 860 350, 910 340, 960 350 L 960 540 L 0 540 Z" fill="#6E6961" opacity="0.5"></path>
      <path d="M0 400 L 960 400 L 960 460 L 0 460 Z" fill="url(#umeMist)"></path>
      <path d="M0 470 L 960 470 L 960 540 L 0 540 Z" fill="#EFECE5"></path>
      <path d="M60 482 C 200 480, 340 486, 480 482 M 520 494 C 640 492, 760 498, 900 494 M 120 506 C 260 504, 380 510, 520 506" stroke="#8E8880" stroke-width="1.2" fill="none" opacity="0.5"></path>
      <path d="M600 482 L 660 482 L 652 490 L 608 490 Z" fill="#2E2B28" opacity="0.8"></path>
      <path d="M628 482 L 628 462 M 628 464 L 642 474" stroke="#2E2B28" stroke-width="1.5" opacity="0.8"></path>
      <path d="M960 18 C 900 30, 850 24, 800 44 C 740 66, 700 60, 640 86 C 590 108, 560 104, 510 124" stroke="#2A2623" stroke-width="9" stroke-linecap="round" fill="none"></path>
      <path d="M800 44 C 790 76, 770 100, 740 120" stroke="#2A2623" stroke-width="5" stroke-linecap="round" fill="none"></path>
      <path d="M700 64 C 690 40, 674 22, 650 10" stroke="#2A2623" stroke-width="4" stroke-linecap="round" fill="none"></path>
      <path d="M600 102 C 592 126, 574 146, 550 160" stroke="#2A2623" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
      <path d="M510 124 C 480 132, 450 130, 420 140" stroke="#2A2623" stroke-width="3" stroke-linecap="round" fill="none"></path>
      <path d="M880 28 C 890 54, 900 70, 920 84" stroke="#2A2623" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
    </svg>
    <sc-for list="{{blossoms}}" as="b" hint-placeholder-count="0">
      <div style="position: absolute; left: {{b.x}}; top: {{b.y}}; width: {{b.d}}; height: {{b.d}}; border-radius: 50%; background: {{b.c}}; box-shadow: inset 0 0 0 2px rgba(120,20,15,.25);"></div>
    </sc-for>
    <sc-for list="{{petals}}" as="p" hint-placeholder-count="0">
      <div class="ume-petal" style="left: {{p.left}}; animation-delay: {{p.delay}}; animation-duration: {{p.dur}};"></div>
    </sc-for>
  </div>

  <div style="position: relative; box-sizing: border-box; height: 100%; padding: 26px 44px 0; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; gap: 14px; height: 84px;">
      <div style="flex-grow: 1; border-radius: 18px; background: rgba(255,255,255,.42); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border: 1px solid rgba(255,255,255,.7); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 10px 30px rgba(40,35,30,.08); display: flex; align-items: center; gap: 18px; padding: 0 24px;">
        <div style="font-weight: 300; font-size: 44px; line-height: 1; letter-spacing: -1px;">04:14</div>
        <div style="font-size: 14px; color: #6B6660;">Friday, 27 November</div>
      </div>
      <button class="ume-cap" onMouseEnter="{{vpn.focus}}" onClick="{{vpn.focus}}" aria-label="VPN: UK" style="outline: none; {{vpn.style}}">
        <span style="font-size: 12px; font-weight: 500; color: #6B6660; letter-spacing: 1px;">VPN</span>
        <span style="font-size: 18px; font-weight: 600; color: #2B2927;">UK</span>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">
      <sc-for list="{{favs}}" as="k" hint-placeholder-count="8">
        <button class="ume-cap" onMouseEnter="{{k.focus}}" onClick="{{k.focus}}" aria-label="{{k.name}}" style="outline: none; {{k.style}}">
          <span style="font-weight: 500; font-size: 17px; color: #2B2927;">{{k.name}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{rest}}" as="k" hint-placeholder-count="6">
        <button class="ume-cap" onMouseEnter="{{k.focus}}" onClick="{{k.focus}}" aria-label="{{k.name}}" style="outline: none; {{k.style}}">
          <span style="font-weight: 500; font-size: 13px; color: #2B2927;">{{k.name}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8392D","options":["#C8392D","#2B2927","#7C8A6E","#5E7A94"]},"petals":{"editor":"range","default":10,"min":0,"max":30,"step":2},"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { focused: 0 }; }
  renderVals() {
    const accent = this.props.accent ?? '#C8392D';
    const petalCount = this.props.petals ?? 10;
    const favs = [['YouTube'], ['Stremio'], ['TV', true], ['Hoichoi'], ['Netflix'], ['Prime Video'], ['BBC iPlayer'], ['ITVX']];
    const rest = [['Settings', true], ['Inputs', true], ['Channel 4'], ['Kodi'], ['Plex'], ['All apps', true]];
    const cap = (h, r, pad, mod, focused) => {
      const face = mod ? 'rgba(238,235,229,.55)' : 'rgba(255,255,255,.6)';
      const base = 'position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; box-sizing: border-box; cursor: pointer; text-align: left; border-radius: ' + r + 'px; height: ' + h + 'px; padding: ' + pad + '; border: 1px solid rgba(255,255,255,.8); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);';
      if (focused) {
        return base + ' background: linear-gradient(135deg, rgba(255,255,255,.97) 0%, rgba(255,255,255,.62) 44%, rgba(255,255,255,.85) 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -4px 0 rgba(0,0,0,.04), 0 0 0 1.5px ' + accent + ', 0 24px 40px rgba(40,35,30,.24); transform: translateY(-4px) scale(1.06); z-index: 2;';
      }
      return base + ' background: ' + face + '; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -4px 0 rgba(0,0,0,.035), 0 6px 16px rgba(40,35,30,.07);';
    };
    const mk = (list, big, offset) => list.map(([name, mod], j) => {
      const i = j + offset;
      const f = this.state.focused === i;
      return {
        name,
        style: big ? cap(96, 18, '0 16px 18px', !!mod, f) : cap(66, 15, '0 12px 14px', !!mod, f),
        focus: () => this.setState({ focused: i })
      };
    });
    const vf = this.state.focused === -1;
    const vpn = {
      style: cap(84, 18, '0 16px 16px', true, vf) + ' width: 130px; flex-shrink: 0; gap: 2px;',
      focus: () => this.setState({ focused: -1 })
    };

    let seed = 5;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    // Blossoms sit along the branch drawn in the SVG.
    const spots = [[940,22],[905,28],[870,26],[838,36],[800,46],[770,58],[735,66],[700,66],[668,78],[640,88],[610,100],[575,108],[545,118],[512,126],[480,130],[448,134],[425,140],[792,78],[770,104],[742,120],[692,44],[668,22],[652,12],[596,126],[574,146],[552,160],[886,52],[904,74],[920,84]];
    const cols = ['#C8392D', '#D24A3C', '#B52E24', '#E06A5A'];
    const blossoms = [];
    spots.forEach(([cx, cy]) => {
      const n = 1 + Math.floor(rnd() * 2);
      for (let k = 0; k < n; k++) {
        const r = 4 + rnd() * 5;
        blossoms.push({
          x: (cx + (rnd() - 0.5) * 22 - r).toFixed(0) + 'px',
          y: (cy + (rnd() - 0.5) * 18 - r).toFixed(0) + 'px',
          d: (2 * r).toFixed(0) + 'px',
          c: cols[Math.floor(rnd() * cols.length)]
        });
      }
    });
    const petals = Array.from({ length: petalCount }, (_, n) => ({
      left: (45 + (n * 23.7) % 55).toFixed(1) + '%',
      delay: ((n * 1.3) % 13).toFixed(2) + 's',
      dur: (11 + (n % 4) * 1.5).toFixed(1) + 's'
    }));
    return { favs: mk(favs, true, 0), rest: mk(rest, false, 100), vpn, blossoms, petals };
  }
}
</script>
</body>
</html>

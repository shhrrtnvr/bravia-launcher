<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ume theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Shippori+Mincho:wght@500;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B8322A}a:hover{color:#8E241D}
@keyframes umeBloom{0%{transform:scale(.3) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}
.ume-cap{transition:transform .14s ease,box-shadow .14s ease}
.ume-bloom{animation:umeBloom .35s ease-out both}
</style>
</helmet>
<div style="width: 960px; height: 540px; position: relative; overflow: hidden; box-sizing: border-box; background: linear-gradient(160deg, #F4F3F0 0%, #E4E2DE 100%); font-family: Inter, system-ui, sans-serif; color: #1F1D1B; padding: 26px 44px 0; display: flex; flex-direction: column; gap: 20px;">

  <div style="display: flex; gap: 14px; height: 84px;">
    <div style="flex-grow: 1; position: relative; overflow: hidden; border-radius: 14px; background: linear-gradient(180deg, #FFFFFF 0%, #F1F0ED 100%); box-shadow: inset 0 -7px 0 #D5D2CC, inset 0 1px 0 #FFFFFF, 0 6px 12px rgba(60,50,40,.12); display: flex; align-items: center; gap: 18px; padding: 0 22px 6px;">
      <svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 600 84" preserveAspectRatio="xMaxYMid slice" style="position: absolute; inset: 0;">
        <path d="M250 84 C 300 40, 330 46, 360 30 C 390 16, 410 38, 440 26 C 480 10, 520 40, 560 22 L 600 30 L 600 84 Z" fill="#7D7A75" opacity="0.18"></path>
        <path d="M330 84 C 370 56, 400 60, 430 48 C 460 38, 500 62, 540 50 C 570 42, 590 56, 600 52 L 600 84 Z" fill="#4A4743" opacity="0.22"></path>
        <path d="M455 62 L 505 62 L 498 68 L 462 68 Z M 478 62 L 478 48 L 490 54 L 478 56" fill="#3A3734" opacity="0.6"></path>
        <path d="M420 70 C 450 68, 520 70, 600 68" stroke="#3A3734" stroke-width="1" opacity="0.25" fill="none"></path>
      </svg>
      <div style="position: relative; font-family: 'Shippori Mincho', serif; font-weight: 500; font-size: 44px; line-height: 1;">04:14</div>
      <div style="position: relative; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 13px; color: #4A4743;">Friday 27 November</div>
        <div style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; color: #B8322A;">金曜日 · 十一月二十七日</div>
      </div>
    </div>
    <button class="ume-cap" onMouseEnter="{{vpn.focus}}" onClick="{{vpn.focus}}" aria-label="VPN: UK" style="outline: none; {{vpn.style}}">
      <span style="font-size: 15px; font-weight: 600; color: #1F1D1B;">VPN · UK</span>
      <span style="font-family: 'Shippori Mincho', serif; font-weight: 700; font-size: 20px; align-self: flex-end; color: #B8322A;">英</span>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">
    <sc-for list="{{favs}}" as="k" hint-placeholder-count="8">
      <button class="ume-cap" onMouseEnter="{{k.focus}}" onClick="{{k.focus}}" aria-label="{{k.name}}" style="outline: none; {{k.style}}">
        <sc-if value="{{k.focused}}" hint-placeholder-val="{{false}}">
          <svg class="ume-bloom" aria-hidden="true" width="58" height="58" viewBox="0 0 58 58" style="position: absolute; right: -6px; top: -8px;">
            <path d="M58 6 C 44 12, 36 20, 28 34" stroke="#2B2724" stroke-width="3" stroke-linecap="round" fill="none"></path>
            <g fill="#D2382B"><circle cx="34" cy="16" r="5"></circle><circle cx="40" cy="12" r="5"></circle><circle cx="42" cy="20" r="5"></circle><circle cx="35" cy="24" r="5"></circle><circle cx="30" cy="19" r="4.5"></circle></g>
            <circle cx="36" cy="18" r="2.2" fill="#F6D9A8"></circle>
            <circle cx="24" cy="38" r="4" fill="#D2382B"></circle><circle cx="50" cy="8" r="3" fill="#D2382B"></circle>
          </svg>
        </sc-if>
        <span style="position: relative; font-weight: 600; font-size: 17px; color: #1F1D1B;">{{k.name}}</span>
        <span style="position: relative; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; align-self: flex-end; color: #B8322A;">{{k.kana}}</span>
      </button>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px;">
    <sc-for list="{{rest}}" as="k" hint-placeholder-count="12">
      <button class="ume-cap" onMouseEnter="{{k.focus}}" onClick="{{k.focus}}" aria-label="{{k.name}}" style="outline: none; {{k.style}}">
        <sc-if value="{{k.art}}" hint-placeholder-val="{{false}}">
          <svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 140 70" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0;">
            <path d="M0 70 C 20 40, 40 44, 60 30 C 80 18, 100 36, 140 24 L 140 70 Z" fill="#6E6B66" opacity="0.28"></path>
            <path d="M0 70 C 30 56, 60 60, 90 50 C 110 44, 130 54, 140 52 L 140 70 Z" fill="#3E3B38" opacity="0.32"></path>
            <path d="M140 4 C 112 14, 96 26, 82 46 M 108 18 C 104 8, 96 4, 90 2" stroke="#24211F" stroke-width="3" stroke-linecap="round" fill="none"></path>
            <g fill="#D2382B"><circle cx="96" cy="24" r="4.5"></circle><circle cx="102" cy="20" r="4"></circle><circle cx="84" cy="40" r="4"></circle><circle cx="118" cy="12" r="4"></circle><circle cx="92" cy="5" r="3.5"></circle><circle cx="126" cy="9" r="3"></circle></g>
          </svg>
        </sc-if>
        <span style="position: relative; font-weight: 500; font-size: 13px; color: #1F1D1B;">{{k.name}}</span>
        <span style="position: relative; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 11px; align-self: flex-end; color: #B8322A;">{{k.kana}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D2382B","options":["#D2382B","#C9543F","#1F1D1B","#3F6E8C"]},"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { focused: 0 }; }
  renderVals() {
    const accent = this.props.accent ?? '#D2382B';
    const favs = [
      ['YouTube', 'ユーチューブ'], ['Stremio', 'ストレミオ'], ['TV', 'テレビ'], ['Hoichoi', 'ホイチョイ'],
      ['Netflix', 'ネットフリックス'], ['Prime Video', 'プライム'], ['BBC iPlayer', 'アイプレイヤー'], ['ITVX', 'アイティーヴィー']
    ];
    const rest = [
      ['Settings', '設定', true], ['Channel 4', 'チャンネル4'], ['Kodi', 'コディ'], ['Plex', 'プレックス'], ['Spotify', 'スポティファイ'], ['Inputs', '入力', true],
      ['Downloader', 'ダウンローダー'], ['Pluto TV', 'プルート'], ['SmartTube', 'スマートチューブ'], ['MX Player', 'エムエックス'], ['LocalSend', 'ローカルセンド'], ['WireGuard', 'ワイヤーガード']
    ];
    const cap = (h, r, pad, focused) => {
      const base = 'position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; box-sizing: border-box; border: none; cursor: pointer; text-align: left; border-radius: ' + r + 'px; height: ' + h + 'px; padding: ' + pad + '; background: linear-gradient(180deg, #FFFFFF 0%, #F1F0ED 100%);';
      if (focused) {
        return base + ' box-shadow: inset 0 -7px 0 #D5D2CC, inset 0 1px 0 #FFFFFF, 0 0 0 3px ' + accent + ', 0 16px 26px rgba(60,40,30,.25); transform: translateY(-5px);';
      }
      return base + ' box-shadow: inset 0 -7px 0 #D5D2CC, inset 0 1px 0 #FFFFFF, 0 6px 12px rgba(60,50,40,.12);';
    };
    const mk = (list, big, offset) => list.map(([name, kana, art], j) => {
      const i = j + offset;
      const f = this.state.focused === i;
      return {
        name, kana, art: !!art, focused: f,
        style: big ? cap(100, 14, '14px 16px 18px', f) : cap(70, 11, '10px 12px 14px', f),
        focus: () => this.setState({ focused: i })
      };
    });
    const vf = this.state.focused === -1;
    const vpn = {
      style: cap(84, 14, '12px 16px 16px', vf) + ' width: 150px; flex-shrink: 0;',
      focus: () => this.setState({ focused: -1 })
    };
    return { favs: mk(favs, true, 0), rest: mk(rest, false, 100), vpn };
  }
}
</script>
</body>
</html>
